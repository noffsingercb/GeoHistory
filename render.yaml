# =============================================================================
# Render blueprint -- GeoHistory API
# =============================================================================
# Render is the live API point. This file exists so the deployment is described
# in the repository instead of living only in a web UI: config that nobody can
# review is config that drifts.
#
# To use it: Render dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file and creates the service. If the blueprint flow gives
# trouble, the equivalent manual settings are:
#
#   New -> Web Service -> connect noffsingercb/GeoHistory
#   Language/Runtime: Docker
#   Branch:           main
#   Instance type:    Free
#   Health check:     /v1/health
#   Environment:      PORT = 8787, NODE_ENV = production
#
# THE DATASET DOES NOT COME FROM HERE. The Dockerfile downloads events.sqlite
# from the `dataset-latest` GitHub release at build time. Publish it before the
# first deploy or the build fails on purpose:
#
#   gh release create dataset-latest events.sqlite --title "Dataset"
#
# After uploading a new dataset to that tag, update DATASET_SHA256 below to the
# new checksum. That is what makes the refresh land: the value is part of the
# build cache key, so changing it forces the download layer to rebuild, and it
# is also checked against the file that arrives. Without it Render reuses the
# cached layer and ships the old database while reporting success.
#
# FREE INSTANCES SLEEP after roughly 15 minutes with no traffic, and the next
# request pays a cold start of up to a minute while the container boots. Circa
# pings /v1/health when the page loads so the machine wakes while the visitor is
# still filling in the form.
#
# NOTE ON RATE LIMITING: it happens inside this process, not at the edge. The
# free plan gives us no WAF and no rate-limiting layer of our own. Render does
# route through Cloudflare (see TRUSTED_PROXY_HOPS below), but that is Render's
# account and not ours: it comes with no rules, no dashboard and no per-client
# limits -- only an extra X-Forwarded-For hop to account for. The client is a
# static bundle on Cloudflare Pages, and a limit enforced in client code is not
# a limit. server.ts is the only place it can be enforced, which is why
# TRUSTED_PROXY_HOPS matters: with the wrong value the limiter keys every
# request in the world to a rotating infrastructure address and quietly stops
# limiting anything at all.
# =============================================================================

services:
  - type: web
    name: geohistory-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Redeploy on every push to main. The dataset is unaffected by this: it is
    # fetched from the release, so a code deploy cannot change the data.
    autoDeploy: true

    # /v1/health does not touch the database, which is what a liveness probe
    # should be. /v1/meta is the readiness check, but note that it reports the
    # SHORT dataset stamp only (dump-v0.6) and so reads identically before and
    # after a rescore. To confirm which data actually shipped, query a window
    # and inspect the rows.
    healthCheckPath: /v1/health

    envVars:
      # Matches EXPOSE and the container healthcheck. Render would otherwise
      # inject its own port and the two would disagree.
      - key: PORT
        value: 8787

      # Set explicitly, and NOT because the Dockerfile already does it.
      #
      # The Dockerfile's ENV NODE_ENV=production is a default that any dashboard
      # or blueprint variable silently overrides, and server.ts reads this one
      # value to decide whether it is in production. When it was absent here,
      # IS_PROD was determined entirely by whether something else happened to
      # set it -- and a security decision should not rest on that. Declaring it
      # in the blueprint makes it reviewable in the repo.
      - key: NODE_ENV
        value: production

      # SHA-256 of the events.sqlite currently published to the dataset-latest
      # release. Render has no separate "Docker build args" section: variables
      # declared here are supplied to the build, and the Dockerfile already
      # declares a matching `ARG DATASET_SHA256=`, so this value reaches the
      # download step.
      #
      # It carries two jobs. It authenticates a file fetched over the network
      # from a mutable tag, and -- because build args participate in the cache
      # key -- changing it is what invalidates the cached download layer. That
      # second job used to belong to DATASET_VERSION, which can no longer do it:
      # that string already read prune5 while the running image still held the
      # July database, so there was nothing left to bump.
      #
      # UPDATE THIS ON EVERY DATASET UPLOAD. The one-liner that prints it:
      #
      #   gh release view dataset-latest --json assets \
      #     --jq '.assets[] | select(.name=="events.sqlite") | .digest'
      #
      # Set 2026-09-09 for dump-v0.6+struct-v0.7.2+reach-v0.3+universal-v0.1+
      # participants-v0.1+prune5 (995,323,904 bytes, uploaded 15:37Z).
      - key: DATASET_SHA256
        value: 010b40c4eaa23b8eab5ba1b99a34b718ec910058082085c8762c8775ca978541

      # Number of hops between the internet and this process, counted from the
      # RIGHT of X-Forwarded-For. MEASURED, not assumed.
      #
      # This file used to say "Render puts exactly one in front of a web
      # service, so the client address is the last entry in X-Forwarded-For."
      # That is false, and it silently disabled per-client rate limiting for as
      # long as it stood. Render fronts its services with Cloudflare, so three
      # layers append to the header before it arrives here.
      #
      # Observed 2026-08-22 by firing 65 requests in 3.5s from a known client
      # address and reading the ip= field that server.ts logs on every request:
      #
      #   hops=1 -> 10.24.83.x, 10.25.191.x     Render's internal load balancer
      #   hops=2 -> 172.68.3.x, 172.71.146.x    Cloudflare edge (172.64.0.0/13)
      #   hops=3 -> the real client address
      #
      # At 1 and 2 the key was an infrastructure address drawn from a rotating
      # pool, so a single client's burst scattered across several buckets and
      # none of them reached the limit of 60 -- the burst returned 65x200 with
      # no 429 at all. At 3 the same burst returns 60x200 + 5x429. That burst
      # is the acceptance test for this value; re-run it after any change here.
      #
      # Counting from the right is what keeps this safe. A caller who sends
      # their own X-Forwarded-For only grows the chain on the left, so a
      # right-anchored index still lands on the address Cloudflare observed and
      # cannot be moved by prepending junk. Setting this HIGHER than the number
      # of layers that genuinely append is the dangerous direction: it indexes
      # into attacker-supplied values and lets a caller choose its own bucket.
      # Too low merely lumps every visitor into one bucket. Neither failure is
      # visible without measuring, so measure -- see net.ts for the indexing.
      - key: TRUSTED_PROXY_HOPS
        value: 3

      # Carried over from fly.toml, which was the only place these were written
      # down. Same values, now on the platform that is actually serving.
      - key: RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW
        value: 60

      # The browser origins allowed to call this API: the Circa custom domain
      # https://circatimeline.org (with and without www), plus the Cloudflare
      # Pages default https://circa-2cg.pages.dev that preceded it.
      # Comma-separated for more than one. Exact match -- Pages PREVIEW
      # deployments get generated hostnames and are therefore refused, which is
      # deliberate but worth remembering when a preview build looks broken.
      #
      # sync: false keeps the value out of the repo and stops a blueprint sync
      # from clearing it. Until it is set the browser is refused every request
      # even though the API is healthy, and the failure looks exactly like an
      # outage.
      #
      # It also now gates two things it did not before: with an allowlist set,
      # POSTs arriving with no Origin header at all are refused (set
      # ALLOW_NO_ORIGIN_POST=true to permit curl and CI), and the localhost dev
      # origins are no longer admitted just because this variable is missing --
      # that needs an explicit ALLOW_DEV_ORIGINS=true and a non-production
      # NODE_ENV, so it cannot happen here at all.
      - key: ALLOWED_ORIGIN
        sync: false
